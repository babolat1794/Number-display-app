<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字表示アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="number-display"></div>

    <div id="controls">
        <button id="toggle-btn">停止</button>
        <button id="end-btn">終了</button>
    </div>

    <div id="time-select">
        <button class="time-btn" data-time="5000">5秒</button>
        <button class="time-btn" data-time="7000">7秒</button>
        <button class="time-btn" data-time="9000">9秒</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
